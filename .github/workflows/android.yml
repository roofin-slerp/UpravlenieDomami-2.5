name: Android 2.5 — Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UpravlenieDomami-Android-2.5/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UpravlenieDomami-Android-2.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: UpravlenieDomami-2.5-debug-APK
          path: UpravlenieDomami-Android-2.5/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
