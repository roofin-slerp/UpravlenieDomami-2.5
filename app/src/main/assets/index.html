:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#20323e;background:#edf2f5}*{box-sizing:border-box}body{margin:0}header{background:#18384b;color:white;padding:22px 16px 16px}header h1{font-size:22px;margin:0 0 6px}header small{color:#c7d8e2}main{max-width:650px;margin:auto;padding:14px 14px 90px}.panel,.item{background:white;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #20323e15}button,input,select,textarea{font:inherit}button{border:0;background:#18384b;color:white;padding:11px 14px;border-radius:10px;cursor:pointer}button.secondary{background:#e6eef2;color:#18384b}button.danger{background:#a33232}button:disabled{opacity:.5}input,select,textarea{width:100%;border:1px solid #cad5dd;border-radius:9px;padding:11px;margin:6px 0 10px;background:white}textarea{min-height:76px}label{display:block;font-size:13px;color:#526674}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid button{min-height:75px;text-align:left}.muted{font-size:13px;color:#60717d}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:12px;border-radius:99px;padding:4px 8px;background:#e5eff4}.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #d5e0e7;padding:9px 3px env(safe-area-inset-bottom)}nav button{font-size:12px;background:transparent;color:#18384b;padding:8px}.red{border-left:5px solid #d34b4b}.yellow{border-left:5px solid #d8aa37}.green{border-left:5px solid #2e9b71}.notice{background:#fff6d8;border-radius:10px;padding:12px;font-size:13px}.item h3{margin:0 0 6px;font-size:16px}h2{font-size:19px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:13px}a{color:#1b658a}.cover{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:8px 0}.avatar{width:55px;height:55px;object-fit:cover;border-radius:50%;vertical-align:middle}.thumb{max-width:100%;max-height:190px;border-radius:9px;margin:6px 0}

</style></head><body><header><h1>⌂ Управление домами</h1><small>Патч 2.5 · локальная демонстрационная сборка</small></header><main><section id="login" class="panel"><h2>Вход</h2><p class="notice">Демонстрационный вход. Любой номер и пароль подходят; настоящей защиты данных пока нет.</p><label>Пользователь</label><select id="loginUser"><option>Олег</option><option>Виталия Мерман</option><option>Манон</option></select><label>Номер телефона</label><input id="phone" type="tel" placeholder="+7 999 123-45-67" autocomplete="tel"><label>Пароль</label><input id="pass" type="password" placeholder="Пароль"><button onclick="login()">Войти</button></section><section id="app" class="hidden"><div class="panel"><div class="row"><strong id="who"></strong><button class="secondary" onclick="logout()">Выйти</button></div><label>Объект</label><select id="home" onchange="render()"><option>Ярославка</option><option>Монолит</option><option>Баня</option></select></div><div id="content"></div></section></main><nav id="nav" class="hidden"><button onclick="page='home';render()">Главная</button><button onclick="page='tasks';render()">Задания</button><button onclick="page='assistant';render()">✦ GPT</button><button onclick="page='works';render()">Работы</button><button onclick="page='more';render()">Ещё</button></nav><script>
const KEY='houses-app-v22';const defaults={tasks:[{id:1,home:'Ярославка',name:'Проверить котельную',who:'Олег',date:'2026-11-07',urgent:false,done:false},{id:2,home:'Монолит',name:'Осмотреть наличники',who:'Олег',date:'2026-11-09',urgent:true,done:false},{id:3,home:'Ярославка',name:'Уход за садом',who:'Манон',date:'2026-11-11',urgent:false,done:false}],groups:[{id:1,name:'Наличники',home:'Монолит'}],expenses:[],messages:[],notifications:[],photos:{},avatars:{},transactions:[],visits:[]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults}catch(e){data=defaults}data.photos??={};data.avatars??={};data.transactions??=[];data.visits??=[];data.audioTasks??={};data.contacts??=[];data.customSections??=[];let page='home',user=sessionStorage.getItem('houses-user')||'',activeGroup=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const h=()=>$('home').value;const finance=()=>user==='Олег'||user==='Виталия Мерман';const tasks=()=>data.tasks.filter(t=>t.home===h()&&(user!=='Манон'||t.who==='Манон'));function login(){if($('phone').value.replace(/\D/g,'').length<10||!$('pass').value){alert('Введите номер телефона и пароль');return}user=$('loginUser').value;sessionStorage.setItem('houses-user',user);show()}function logout(){sessionStorage.removeItem('houses-user');user='';show()}function show(){$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('nav').classList.toggle('hidden',!user);if(user){$('who').textContent=user;render()}}function field(id,label,type='text',extra=''){return `<label>${label}</label><input id="${id}" type="${type}" ${extra}>`}function taskColor(t){if(t.urgent)return 'red';let diff=(new Date(t.date+'T12:00:00')-new Date())/86400000;return diff<=3?'yellow':'green'}function render(){if(!user)return;let html='',ts=tasks();if(page==='home'){html=`<h2>Управление домами · 2.5</h2><div class="house-grid">${[['Ярославка','yaroslavka-card.png'],['Монолит','monolit-card.png'],['Баня','banya-card.png']].map(([name,img])=>`<button class="house-card ${h()===name?'active':''}" onclick="document.getElementById('home').value='${name}';render()"><img src="${img}" alt="${name}"><strong>${name}</strong></button>`).join('')}</div><p class="section-title">${esc(h())} · Обзор объекта</p><div class="summary-grid"><div class="panel"><strong>${ts.filter(t=>!t.done).length}</strong><div class="muted">Активных задач</div></div><div class="panel"><strong>${ts.filter(t=>t.done).length}</strong><div class="muted">Выполнено</div></div></div><p class="section-title">Разделы и управление</p><div class="module-grid">${[['tasks','✓ Задачи'],['calendar','▦ Календарь'],['contacts','♙ Контакты'],['works','⚒ Работы'],['equipment','⚙ Оборудование'],['journal','▤ Журнал'],['photos','▧ Фото и видео'],['sections','⊞ Разделы'],['assistant','✦ GPT-помощник'],['notifications','♧ Уведомления'],['profile','♙ Сотрудники / профиль'],['chat','◌ Чат'],...(finance()?[['expenses','₽ Расходы']]:[])].map(([p,t])=>`<button onclick="page='${p}';render()">${t}</button>`).join('')}</div><p class="notice">Локальный прототип. Настоящий GPT, общая база Android/iOS и серверные права доступа пока не подключены.</p>`}else if(page==='tasks'){html='<h2>Задания</h2>'+ts.map(t=>`<div class="item ${taskColor(t)}"><h3>${esc(t.name)}</h3><div class="muted">${esc(t.who)} · ${esc(t.date)} · ${t.done?'Выполнено':'В работе'}</div>${t.audio?`<div class="tools"><button class="secondary" onclick="playTaskAudio(${t.id})">▶ Прослушать поручение</button></div>`:''}${t.transcript?`<p><b>Расшифровка:</b> ${esc(t.transcript)}</p>`:''}${!t.done&&(user==='Олег'||user===t.who)?`<button class="secondary" onclick="finish(${t.id})">✓ Завершить</button>`:''}</div>`).join('');if(user!=='Манон')html+=`<div class="panel"><h3>Новое задание</h3>${field('taskName','Что сделать?')}<label>Голосовое поручение</label><div class="tools"><button type="button" onclick="startRecording()" id="startRec">🎙 Записать</button><button type="button" class="secondary" onclick="stopRecording()" id="stopRec">■ Остановить</button></div><p id="recordStatus" class="muted">Можно записать голос или прикрепить аудиофайл.</p><input id="taskAudioFile" type="file" accept="audio/*" onchange="attachAudio(event)"><button type="button" class="secondary" onclick="recognizeSpeech()">🎤 Продиктовать текст</button><label>Расшифровка (можно исправить вручную)</label><textarea id="taskTranscript" placeholder="Текст голосового поручения"></textarea>${field('taskDate','Срок','date')}<label>Исполнитель</label><select id="taskWho"><option>Олег</option><option>Манон</option></select><label><input id="taskUrgent" type="checkbox" style="width:auto"> Не забыть (срочно)</label><button onclick="addTask()">Добавить</button></div>`}else if(page==='calendar'){let vs=data.visits.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));html='<h2>Календарь приездов</h2><p class="notice">Записи сохраняются только на этом устройстве. Для общего календаря на разных телефонах нужен сервер.</p>'+vs.map(v=>`<div class="item"><strong>${esc(v.date)} ${esc(v.time)} · ${esc(v.home)}</strong><div>${esc(v.name)} · ${esc(v.phone)}</div><div class="muted">${esc(v.purpose)}</div><button class="secondary" onclick="editVisit(${v.id})">Изменить</button></div>`).join('')+`<div class="panel"><h3 id="visitTitle">Добавить приезд</h3><input type="hidden" id="visitId"><label>Дом</label><select id="visitHome"><option>Ярославка</option><option>Монолит</option><option>Баня</option></select>${field('visitDate','Дата','date')}${field('visitTime','Время приезда','time')}${field('visitName','Имя / организация')}${field('visitPhone','Телефон','tel')}${field('visitPurpose','Цель визита')}<button onclick="saveVisit()">Сохранить</button></div>`}else if(page==='works'){html='<h2>Строительные и отдельные работы</h2>'+data.groups.filter(g=>g.home===h()).map(g=>`<div class="item"><h3>${esc(g.name)}</h3><button class="secondary" onclick="activeGroup=${g.id};page='group';render()">Открыть группу →</button></div>`).join('');if(user!=='Манон')html+=`<div class="panel"><h3>Новая группа</h3>${field('groupName','Название группы')}<button onclick="addGroup()">Создать</button></div>`}else if(page==='group'){let g=data.groups.find(g=>g.id===activeGroup);if(!g){page='works';return render()}html=`<h2>${esc(g.name)}</h2><div class="muted">${esc(g.home)}</div><div class="grid"><button onclick="page='assistant';render()">✦ GPT</button><button onclick="page='tasks';render()">Задания</button>${finance()?`<button onclick="page='expenses';render()">Расходы</button>`:''}</div>`}else if(page==='chat'){html='<h2>Общий чат (локальный)</h2><p class="notice">Сообщения видны только на этом устройстве и не отправляются другим людям.</p>'+data.messages.map(m=>`<div class="item"><strong>${esc(m.who)}</strong><p>${esc(m.text)}</p><small class="muted">${esc(m.date)}</small></div>`).join('')+`<div class="panel"><label>Сообщение</label><textarea id="message"></textarea><button onclick="sendMessage()">Отправить</button></div>`}else if(page==='expenses'&&finance()){let ee=data.transactions.filter(e=>e.home===h()),income=ee.filter(e=>e.type==='Приход').reduce((s,e)=>s+e.amount,0),out=ee.filter(e=>e.type==='Закуп').reduce((s,e)=>s+e.amount,0),allIncome=data.transactions.filter(e=>e.type==='Приход').reduce((s,e)=>s+e.amount,0),allOut=data.transactions.filter(e=>e.type==='Закуп').reduce((s,e)=>s+e.amount,0),byHouse=['Ярославка','Монолит','Баня'].map(home=>({home,sum:data.transactions.filter(e=>e.type==='Закуп'&&e.home===home).reduce((s,e)=>s+e.amount,0)}));html=`<h2>Финансы · все объекты</h2><div class="grid"><div class="panel">Общий приход<strong><div>${allIncome.toLocaleString('ru-RU')} ₽</div></strong></div><div class="panel">Общий расход<strong><div>${allOut.toLocaleString('ru-RU')} ₽</div></strong></div></div><div class="panel"><strong>Общий остаток: ${(allIncome-allOut).toLocaleString('ru-RU')} ₽</strong></div><h3>Расходы по объектам</h3>${byHouse.map(x=>`<div class="item row"><span>${esc(x.home)}</span><strong>${x.sum.toLocaleString('ru-RU')} ₽</strong></div>`).join('')}<h2>Операции · ${esc(h())}</h2><p class="notice">Демонстрационный локальный учёт. Настоящая защита финансов и синхронизация между пользователями пока отсутствуют.</p><div class="grid"><div class="panel">Приход<strong><div>${income.toLocaleString('ru-RU')} ₽</div></strong></div><div class="panel">Закуп<strong><div>${out.toLocaleString('ru-RU')} ₽</div></strong></div></div><div class="panel"><strong>Баланс: ${(income-out).toLocaleString('ru-RU')} ₽</strong></div><div class="tools"><button class="secondary" onclick="document.getElementById('txType').value='Закуп'">Закуп</button><button class="secondary" onclick="document.getElementById('txType').value='Приход'">Приход</button></div>`+ee.slice().reverse().map(e=>`<div class="item"><strong>${esc(e.type)} · ${esc(e.name)}</strong><div>${e.amount.toLocaleString('ru-RU')} ₽ · ${esc(e.who)} · ${esc(e.date)}</div>${e.photo?`<img class="thumb" src="${e.photo}" alt="Фото чека или покупки">`:''}</div>`).join('')+`<div class="panel"><h3>Добавить запись</h3><label>Тип</label><select id="txType"><option>Закуп</option><option>Приход</option></select>${field('txName','Описание')}${field('txAmount','Сумма, ₽','number','min="0.01" step="0.01"')}<label>Фото покупки или чека</label><input id="txPhoto" type="file" accept="image/*"><button onclick="addTransaction()">Сохранить</button></div>`}else if(page==='journal'){html='<h2>Журнал выполненных работ</h2>'+ts.filter(t=>t.done).map(t=>`<div class="item">✓ ${esc(t.name)}<div class="muted">${esc(t.who)}</div></div>`).join('')}else if(page==='equipment'){html='<h2>Оборудование</h2>'+['Котельная','Водоочистка','Вентиляция и кондиционирование','Бытовая техника'].map(x=>`<div class="item">${x}</div>`).join('')}else if(page==='notifications'){html='<h2>Уведомления</h2><p class="notice">Это внутренний список событий, не системные push-уведомления.</p>'+data.notifications.slice().reverse().map(n=>`<div class="item">${esc(n)}</div>`).join('')}else if(page==='more'){html='<h2>Другие разделы</h2><div class="grid">'+[['calendar','Календарь приездов'],['expenses','Финансы'],['equipment','Оборудование'],['journal','Журнал работ'],['notifications','Уведомления'],['photos','Фото объекта'],['profile','Мой профиль'],['people','Сотрудники'],['contacts','Контакты и специалисты'],['sections','Конструктор разделов'],['assistant','GPT-помощник'],['backup','Резервная копия']].filter(([p])=>p!=='expenses'||finance()).map(([p,t])=>`<button onclick="page='${p}';render()">${t}</button>`).join('')+'</div>'}else if(page==='contacts'){html=renderContacts()}else if(page==='sections'){html=renderSections()}else if(page==='assistant'){html=renderAssistant()}else if(page==='people'){html='<h2>Сотрудники</h2>'+[['Олег','Управляющий домами'],['Виталия Мерман','Владелица'],['Манон','Садовник']].map(([n,r])=>`<div class="item">${data.avatars[n]?`<img class="avatar" src="${data.avatars[n]}">`:''}<strong>${n}</strong><div class="muted">${r}</div></div>`).join('')}else if(page==='photos'){html=`<h2>Фотографии · ${esc(h())}</h2>${data.photos[h()]?`<img class="cover" src="${data.photos[h()]}" alt="Главное фото">`:''}<div class="panel"><h3>Изменить главное фото дома</h3><input type="file" accept="image/*" onchange="setPhoto(event,'home')"></div><h3>Фотографии объектов</h3>`+(data.photos[h()+'-gallery']||[]).map((img,i)=>`<div class="item"><img class="cover" src="${img}" alt="Фото объекта"><button class="secondary" onclick="deleteGallery(${i})">Удалить</button></div>`).join('')+`<div class="panel"><input type="file" accept="image/*" onchange="setPhoto(event,'gallery')"></div>`}else if(page==='profile'){html=`<h2>Мой профиль</h2><div class="panel"><strong>${esc(user)}</strong>${data.avatars[user]?`<div><img class="avatar" src="${data.avatars[user]}" alt="Аватар"></div>`:''}<label>Изменить фото профиля</label><input type="file" accept="image/*" onchange="setPhoto(event,'avatar')"></div>`}else if(page==='backup'){html='<h2>Резервная копия</h2><p class="notice">Данные хранятся в памяти браузера. При удалении данных сайта они пропадут. Сохраняйте резервную копию.</p><button onclick="backup()">Скачать JSON-копию</button><label>Восстановить из файла</label><input type="file" accept="application/json" onchange="restore(event)">'}else{page='home';return render()}$('content').innerHTML=html}async function addTask(){let name=$('taskName').value.trim(),date=$('taskDate').value;if(!name||!date)return alert('Укажите задачу и срок');let transcript=$('taskTranscript').value.trim(),audio='';if(pendingAudio){if(pendingAudio.size>1500000)return alert('Аудиозапись больше 1,5 МБ. Для больших записей потребуется серверное хранилище.');audio=await fileToDataURL(pendingAudio)}data.tasks.push({id:Date.now(),home:h(),name,who:$('taskWho').value,date,urgent:$('taskUrgent').checked,done:false,author:user,transcript,audio});pendingAudio=null;data.notifications.push('Новое задание: '+name);save();render()}function finish(id){let t=data.tasks.find(x=>x.id===id);if(t){t.done=true;data.notifications.push('Выполнено: '+t.name);save();render()}}function addGroup(){let name=$('groupName').value.trim();if(!name)return;data.groups.push({id:Date.now(),name,home:h()});save();render()}function addExpense(){if(!finance())return;let name=$('expenseName').value.trim(),amount=Number($('expenseSum').value);if(!name||!(amount>0))return alert('Укажите наименование и сумму');data.expenses.push({home:h(),name,amount,group:$('expenseGroup').value});save();render()}function sendMessage(){let text=$('message').value.trim();if(!text)return;data.messages.push({who:user,text,date:new Date().toLocaleString('ru-RU')});save();render()}function saveVisit(){let date=$('visitDate').value,time=$('visitTime').value,name=$('visitName').value.trim(),phone=$('visitPhone').value.trim(),purpose=$('visitPurpose').value.trim();if(!date||!time||!name||!phone||!purpose)return alert('Заполните все поля, включая телефон и время');let id=Number($('visitId').value),v={id:id||Date.now(),home:$('visitHome').value,date,time,name,phone,purpose};if(id){let i=data.visits.findIndex(x=>x.id===id);if(i>=0)data.visits[i]=v;else data.visits.push(v)}else data.visits.push(v);save();render()}function editVisit(id){let v=data.visits.find(x=>x.id===id);if(!v)return;for(let [k,val] of Object.entries({visitId:v.id,visitHome:v.home,visitDate:v.date,visitTime:v.time,visitName:v.name,visitPhone:v.phone,visitPurpose:v.purpose}))$(k).value=val;$('visitTitle').textContent='Изменить приезд';$('visitTitle').scrollIntoView({behavior:'smooth'})}function imageData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/img.width,1000/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};img.src=r.result};r.readAsDataURL(file)})}async function setPhoto(ev,kind){let f=ev.target.files[0];if(!f)return;try{let img=await imageData(f);if(kind==='home')data.photos[h()]=img;else if(kind==='avatar')data.avatars[user]=img;else(data.photos[h()+'-gallery']??=[]).push(img);save();render()}catch(e){alert('Не удалось сохранить фото. Попробуйте изображение меньшего размера.')}}function deleteGallery(i){if(!confirm('Удалить фото?'))return;data.photos[h()+'-gallery'].splice(i,1);save();render()}async function addTransaction(){if(!finance())return;let amount=Number($('txAmount').value),name=$('txName').value.trim();if(!name||!(amount>0))return alert('Введите описание и сумму');try{let f=$('txPhoto').files[0],photo=f?await imageData(f):'';data.transactions.push({home:h(),type:$('txType').value,name,amount,photo,who:user,date:new Date().toLocaleString('ru-RU')});save();render()}catch(e){alert('Не удалось сохранить запись или фото')}}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='upravlenie-domami-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function restore(ev){let file=ev.target.files[0];if(!file)return;file.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.tasks)||!Array.isArray(d.groups)||!Array.isArray(d.expenses))throw Error('Неверный файл');if(confirm('Заменить все локальные данные данными из файла?')){data=d;save();render()}}).catch(()=>alert('Не удалось прочитать резервную копию'))}
let recorder=null,recordChunks=[],pendingAudio=null;
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return alert('Запись микрофона недоступна в этой версии WebView. Используйте прикрепление аудиофайла.');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{pendingAudio=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());const el=$('recordStatus');if(el)el.textContent='Запись готова: '+Math.round(pendingAudio.size/1024)+' КБ';};recorder.start();$('recordStatus').textContent='Идёт запись…';}catch(e){alert('Не удалось получить доступ к микрофону: '+e.message)}}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop()}
function attachAudio(e){pendingAudio=e.target.files?.[0]||null;const el=$('recordStatus');if(el&&pendingAudio)el.textContent='Прикреплён файл: '+pendingAudio.name}
function playTaskAudio(id){const t=data.tasks.find(t=>t.id===id);if(!t?.audio)return;const a=new Audio(t.audio);a.play().catch(()=>alert('Не удалось воспроизвести запись'))}
function recognizeSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Распознавание речи на этом устройстве недоступно. Запишите аудио и заполните расшифровку вручную.');const r=new SR();r.lang='ru-RU';r.interimResults=false;r.onresult=e=>{$('taskTranscript').value=($('taskTranscript').value+' '+e.results[0][0].transcript).trim()};r.onerror=e=>alert('Распознавание не удалось: '+e.error);r.start()}
// Patch 2.4: local contact directory and configurable sections. No remote AI or sync.
const admin=()=>user==='Олег'||user==='Виталия Мерман';
let contactFilter='Все',contactQuery='',editingContact=null;
function renderContacts(){const matches=data.contacts.filter(c=>(contactFilter==='Все'||c.kind===contactFilter)&&[c.name,c.role,c.phone,(c.homes||[]).join(' ')].join(' ').toLowerCase().includes(contactQuery.toLowerCase()));return `<h2>Единый справочник</h2><p class="notice">Поиск по имени, должности, телефону и объекту. Данные сохраняются локально на этом устройстве.</p><input id="contactSearch" placeholder="Поиск контактов" value="${esc(contactQuery)}" oninput="contactQuery=this.value;refreshContactList()"><select id="contactFilter" onchange="contactFilter=this.value;refreshContactList()"><option ${contactFilter==='Все'?'selected':''}>Все</option><option ${contactFilter==='Сотрудник'?'selected':''}>Сотрудник</option><option ${contactFilter==='Специалист'?'selected':''}>Специалист</option></select><div id="contactList">${contactListHtml(matches)}</div>${admin()?`<div class="panel"><h3>${editingContact?'Изменить контакт':'Новый контакт'}</h3>${field('cName','Имя и фамилия')}${field('cRole','Должность / специальность')}${field('cPhone','Телефон','tel')}<label>Категория</label><select id="cKind"><option>Сотрудник</option><option>Специалист</option></select><label>Объекты</label>${['Ярославка','Монолит','Баня'].map((x,i)=>`<label><input type="checkbox" id="cHome${i}" style="width:auto"> ${x}</label>`).join('')}<label>Фотография</label><input type="file" id="cPhoto" accept="image/*"><button onclick="saveContact()">Сохранить контакт</button></div>`:''}`}
function contactListHtml(items){return items.length?items.map(c=>`<div class="item">${c.photo?`<img class="avatar" src="${c.photo}" alt="Фото контакта">`:''}<strong>${esc(c.name)}</strong><div>${esc(c.role)} · ${esc(c.kind)}</div><div class="muted">${esc((c.homes||[]).join(', '))}</div>${c.phone?`<a href="tel:${esc(c.phone.replace(/[^+0-9]/g,''))}">${esc(c.phone)}</a>`:''}${admin()?`<div class="tools"><button class="secondary" onclick="editContact(${c.id})">Изменить</button><button class="secondary" onclick="archiveContact(${c.id})">Удалить</button></div>`:''}</div>`).join(''):'<p class="muted">Контакты не найдены</p>'}
function refreshContactList(){const el=$('contactList');if(el)el.innerHTML=contactListHtml(data.contacts.filter(c=>(contactFilter==='Все'||c.kind===contactFilter)&&[c.name,c.role,c.phone,(c.homes||[]).join(' ')].join(' ').toLowerCase().includes(contactQuery.toLowerCase())))}
async function saveContact(){if(!admin())return;const name=$('cName').value.trim(),role=$('cRole').value.trim(),phone=$('cPhone').value.trim();if(!name||!role)return alert('Укажите имя и должность');const old=data.contacts.find(x=>x.id===editingContact),file=$('cPhoto').files[0];let photo=old?.photo||'';if(file)photo=await imageData(file);const c={id:editingContact||Date.now(),name,role,phone,kind:$('cKind').value,homes:['Ярославка','Монолит','Баня'].filter((x,i)=>$('cHome'+i).checked),photo};if(old)Object.assign(old,c);else data.contacts.push(c);editingContact=null;save();render()}
function editContact(id){if(!admin())return;editingContact=id;render();const c=data.contacts.find(x=>x.id===id);if(!c)return;$('cName').value=c.name;$('cRole').value=c.role;$('cPhone').value=c.phone;$('cKind').value=c.kind;['Ярославка','Монолит','Баня'].forEach((x,i)=>$('cHome'+i).checked=(c.homes||[]).includes(x))}
function archiveContact(id){if(!admin()||!confirm('Удалить контакт?'))return;data.contacts=data.contacts.filter(x=>x.id!==id);save();render()}
function renderSections(){return `<h2>Конструктор подразделов</h2><p class="notice">Изменения доступны администратору. Новые разделы хранятся только на устройстве.</p>${data.customSections.map(c=>`<div class="item"><strong>${esc(c.home)} → ${esc(c.name)}</strong><div class="muted">${esc(c.fields.join(' · '))}</div>${admin()?`<button class="secondary" onclick="removeSection(${c.id})">Удалить</button>`:''}</div>`).join('')}${admin()?`<div class="panel"><h3>Добавить подраздел</h3><label>Расположение</label><select id="sectionHome"><option>Общий раздел</option><option>Ярославка</option><option>Монолит</option><option>Баня</option></select>${field('sectionName','Название')}<label>Содержимое</label>${['Задачи','Фото','Документы','Расходы','Комментарии','Дата','Ответственный'].map((x,i)=>`<label><input type="checkbox" id="sectionField${i}" style="width:auto"> ${x}</label>`).join('')}<button onclick="addSection24()">Создать после подтверждения</button></div>`:''}`}
function addSection24(){if(!admin())return;const name=$('sectionName').value.trim(),home=$('sectionHome').value;if(!name)return alert('Укажите название');if(data.customSections.some(x=>x.home===home&&x.name.toLowerCase()===name.toLowerCase()))return alert('Такой подраздел уже есть');const fields=['Задачи','Фото','Документы','Расходы','Комментарии','Дата','Ответственный'].filter((x,i)=>$('sectionField'+i).checked);if(!confirm(`Создать раздел «${name}» в «${home}»?`))return;data.customSections.push({id:Date.now(),home,name,fields});save();render()}
function removeSection(id){if(!admin()||!confirm('Удалить этот раздел?'))return;data.customSections=data.customSections.filter(x=>x.id!==id);save();render()}
function renderAssistant(){return `<h2>GPT-помощник</h2><p class="notice">Демонстрационный помощник: локальное распознавание создания раздела и диктовка (если поддерживается устройством). Это НЕ подключение к OpenAI API. Для задач, расходов и поиска используйте соответствующие разделы.</p><textarea id="assistantCommand" placeholder="Например: Создай раздел Бассейн на Монолите"></textarea><div class="tools"><button class="secondary" onclick="dictateAssistant25()">🎙 Продиктовать</button><button onclick="prepareAssistantCommand()">Подготовить действие</button></div><div id="assistantPreview"></div>`}
function dictateAssistant25(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Распознавание речи недоступно на этом устройстве');const r=new SR();r.lang='ru-RU';r.onresult=e=>{const el=$('assistantCommand');el.value=(el.value+' '+e.results[0][0].transcript).trim()};r.onerror=e=>alert('Ошибка диктовки: '+e.error);r.start()}
function prepareAssistantCommand(){const v=$('assistantCommand').value.trim();if(!v)return;const m=v.match(/(?:создай|добавь)\s+(?:новый\s+)?(?:раздел|подраздел)\s+[«"]?(.+?)[»"]?\s+(?:на|для|в)\s+(Ярославке|Монолите|Бане)/i);const home=m?({'Ярославке':'Ярославка','Монолите':'Монолит','Бане':'Баня'}[m[2]]):null;const target=$('assistantPreview');if(!m){target.innerHTML='<p class="notice">Команда сохранения не распознана. Используйте конструктор разделов или справочник.</p>';return}target.innerHTML=`<div class="panel"><strong>Предпросмотр:</strong> ${esc(home)} → ${esc(m[1])}<p>Это локальный разбор команды, а не ответ GPT.</p><button onclick="confirmAssistantSection('${esc(m[1]).replace(/'/g,'&#39;')}','${home}')">Подтвердить создание</button></div>`}
function confirmAssistantSection(name,home){if(!admin())return alert('Только администратор может создавать разделы');if(data.customSections.some(x=>x.home===home&&x.name===name))return alert('Раздел уже существует');if(!confirm(`Создать ${home} → ${name}?`))return;data.customSections.push({id:Date.now(),home,name,fields:[]});save();page='sections';render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});show();
</script></body></html>
